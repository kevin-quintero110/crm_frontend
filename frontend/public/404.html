<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirigiendo...</title>
    <script>
      var path = window.location.pathname;
      window.location.replace(
        window.location.origin + "/?path=" + encodeURIComponent(path)
      );
    </script>
  </head>
  <body>
    <p>Redirigiendo a la página solicitada...</p>
  </body>
</html>
